<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10171b">
  <title data-i18n="ui.pageTitle"></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" data-i18n-aria="ui.canvas"></canvas>
  <div id="hud" hidden>
    <div class="topbar">
      <div class="identity"><span class="eyebrow">PROJECT</span><strong>ASHFALL</strong></div>
      <div class="health-block"><div class="meter-label"><span data-i18n="hud.health"></span><span id="hpText"></span></div><div class="bar"><i id="hpBar"></i></div></div>
      <div class="clock"><strong id="timeText">00:00</strong><span id="phaseText"></span></div>
      <button id="pauseButton" class="small-button" data-i18n-title="ui.pauseHint" data-i18n-aria="ui.pauseHint">Ⅱ</button>
    </div>
    <div class="xp"><i id="xpBar"></i><span id="levelText">LV 1</span></div>
    <div id="bossHud" hidden><div class="meter-label"><span id="bossName"></span><span id="bossHp"></span></div><div class="bar boss"><i id="bossBar"></i></div></div>
    <div id="announcement"></div>
    <div class="bottom-hud">
      <div class="dash-widget"><span class="key" data-i18n="hud.leftClick"></span><div><b data-i18n="term.stitch"></b><div class="bar dash"><i id="dashBar"></i></div></div><span id="dashText">READY</span></div>
      <div id="buildChips"></div>
      <div class="kills"><span id="killText">0</span> <span data-i18n="hud.kills"></span></div>
    </div>
    <div id="coach"><span class="eyebrow" data-i18n="hud.cycle"></span><div class="cycle-steps"><span class="step prime" data-i18n="coach.aim"></span><i>→</i><span class="step mark" data-i18n="coach.mark"></span><i>→</i><span class="step leap" data-i18n="coach.stitch"></span></div><b id="coachHint"></b><small data-i18n="coach.route"></small></div>
    <div class="route-status"><span id="primeText"></span><span id="routeText"></span></div>
    <div id="hint" data-i18n="hud.controls"></div>
  </div>
  <main id="title" class="screen">
    <div class="title-copy"><span class="eyebrow accent">STITCH TO SURVIVE</span><h1>ASH<span>FALL</span><em>PROJECT</em></h1><p class="tagline" data-i18n="title.tagline"></p><p class="intro" data-i18n-html="title.intro"></p>
  <div id="languageChoice" class="language-choice" role="group" data-i18n-aria="ui.language"><button id="languageJa" data-i18n="language.ja" aria-pressed="true"></button><button id="languageEn" data-i18n="language.en" aria-pressed="false"></button></div>
    <button id="startButton" class="primary" data-i18n-html="ui.start"></button>
    <div class="title-actions"><button id="helpButton" class="text-button" data-i18n="ui.help"></button><button id="soundButton" class="text-button"></button><button id="fullscreenButton" class="text-button"></button></div>
    <button id="relicButton" class="text-button"></button><div class="record" id="recordText"></div></div>
    <div class="title-aside"><span class="vertical">THE FURNACE REMEMBERS</span><div class="mechanic-note"><span class="eyebrow" data-i18n="hud.cycle"></span><p data-i18n-html="title.mechanic"></p></div></div>
    <footer><span data-i18n="title.platform"></span> <span><span id="versionLabel"></span> / <span data-i18n="title.prototype"></span></span></footer>
  </main>
  <section id="help" class="screen overlay" hidden><div class="panel help-panel"><span class="eyebrow accent">FIELD MANUAL</span><h2 data-i18n="ui.help"></h2><div class="help-grid"><p data-i18n-html="help.step.1"></p><p data-i18n-html="help.step.2"></p><p data-i18n-html="help.step.3"></p><p data-i18n-html="help.step.4"></p></div><p class="muted" data-i18n-html="help.details"></p><button id="closeHelp" class="primary" data-i18n="ui.back"></button></div></section>
  <section id="relics" class="screen overlay" hidden><div class="panel relic-panel"><span class="eyebrow accent">TAKE ONE EMBER</span><h2 data-i18n="relic.title"></h2><p id="relicMarks" class="muted"></p><div id="relicChoices"></div><p class="muted" data-i18n="relic.explanation"></p><button id="closeRelics" class="primary" data-i18n="relic.close"></button></div></section>
  <section id="upgrade" class="screen overlay" hidden><div class="upgrade-panel"><span class="eyebrow accent">THE FIRE CHANGES YOU</span><h2 data-i18n="upgrade.title"></h2><p id="upgradeSub" class="muted"></p><div id="upgradeCards"></div><p class="muted keyboard-note" data-i18n="upgrade.controls"></p></div></section>
  <section id="pause" class="screen overlay" hidden><div class="panel"><span class="eyebrow accent">A MOMENT IN THE ASH</span><h2 data-i18n="pause.title"></h2><button id="resumeButton" class="primary" data-i18n="ui.resume"></button><button id="pauseSound" class="secondary"></button><button id="pauseFullscreen" class="secondary"></button><button id="pauseHelp" class="text-button" data-i18n="ui.help"></button><button id="quitButton" class="text-button" data-i18n="ui.quit"></button></div></section>
  <section id="result" class="screen overlay" hidden><div class="panel result-panel"><span class="eyebrow accent" id="resultEyebrow">THE FIRE FADES</span><h2 id="resultTitle"></h2><p id="resultCopy" class="muted"></p><div id="resultStats"></div><div id="resultBuild"></div><p class="muted" id="metaText"></p><button id="restartButton" class="primary" data-i18n-html="ui.retry"></button><button id="titleButton" class="text-button" data-i18n="ui.title"></button></div></section>
  <aside id="debugStatus"><strong id="debugBadge" hidden></strong><button id="debugOpen" hidden></button><small id="debugAvailability"></small></aside>
  <section id="debugPanel" class="screen overlay" role="dialog" aria-modal="true" aria-labelledby="debugTitle" hidden>
    <div class="panel debug-panel">
      <h2 id="debugTitle"></h2><p id="debugSessionHelp" class="muted"></p><p id="debugTime"></p>
      <label id="debugUpgradeLabel" for="debugUpgrade"></label><select id="debugUpgrade"></select><p id="debugUpgradeDetail"></p><button id="debugGrant" class="secondary"></button>
      <label id="debugSecondsLabel" for="debugSeconds"></label><input id="debugSeconds" type="number" min="0.01" step="any" value="60"><p id="debugTimeHelp" class="muted"></p><button id="debugAdvance" class="secondary"></button>
      <label id="debugBossLabel" for="debugBoss"></label><select id="debugBoss"></select><button id="debugBossSpawn" class="secondary"></button>
      <label id="debugEnemyLabel" for="debugEnemy"></label><select id="debugEnemy"></select><label id="debugCountLabel" for="debugCount"></label><input id="debugCount" type="number" min="1" step="1" value="3"><p id="debugLimits" class="muted"></p><button id="debugEnemySpawn" class="secondary"></button>
      <button id="debugInvincible" class="secondary"></button><p id="debugMessage" role="status" aria-live="polite"></p><button id="debugClose" class="primary"></button>
    </div>
  </section>
  <script src="version.js"></script>
  <script src="storage.js"></script>
  <script src="i18n/ja.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n.js"></script>
  <script src="upgrades.js"></script>
  <script src="relics.js"></script>
  <script src="audio.js"></script>
  <script src="ui.js"></script>
  <script src="input.js"></script>
  <script src="debug-ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
